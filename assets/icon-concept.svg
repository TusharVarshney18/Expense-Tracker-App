<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B0D12"/>
      <stop offset="1" stop-color="#151B27"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3DDC97"/>
      <stop offset="1" stop-color="#25B97B"/>
    </linearGradient>
  </defs>

  <!-- Ink tile -->
  <rect width="1024" height="1024" rx="220" fill="url(#ink)"/>

  <!-- Accent mark -->
  <rect x="248" y="248" width="528" height="528" rx="156" fill="url(#accent)"/>

  <!-- Rupee glyph -->
  <text
    x="512"
    y="522"
    text-anchor="middle"
    dominant-baseline="central"
    font-family="Segoe UI, Inter, Arial, sans-serif"
    font-weight="700"
    font-size="338"
    fill="#04251A"
  >₹</text>

  <!-- Orbit accent -->
  <circle cx="780" cy="244" r="18" fill="#3DDC97" opacity="0.9"/>
</svg>
